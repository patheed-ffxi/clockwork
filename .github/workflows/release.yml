name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    # The harness stands in for Ashita's file functions with Windows shell
    # commands, so the suite runs on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r test/requirements.txt

      - name: Run the offline harness
        run: python test/run_tests.py

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the tag matches addon.version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n "s/^addon\.version *= *'\([^']*\)'.*/\1/p" clockwork.lua)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match addon.version '${version}'" >&2
            exit 1
          fi

      - name: Package addon
        run: |
          mkdir -p release/clockwork
          cp clockwork.lua LICENSE release/clockwork/
          cp .github/release/README.md release/clockwork/README.md
          cp -r cw assets release/clockwork/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clockwork
          path: release/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          zip -r ../clockwork.zip clockwork/
          cd ..
          gh release create "${{ github.ref_name }}" clockwork.zip --generate-notes

name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  # release.yml runs these before it packages a release
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # The harness stands in for Ashita's file functions with Windows shell
    # commands, so the suite runs on Windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python -m pip install -r test/requirements.txt

      - name: Run the offline harness
        run: python test/run_tests.py
